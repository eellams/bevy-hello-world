[package]
name = "bevy-hello-world"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "bevy_asset",
    "bevy_sprite",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_ui",
    "bevy_text",
    "bevy_pbr",
    "tonemapping_luts",
    "png",
    "wayland",
    "zstd_rust",
    "default_font",
    "file_watcher",
] }
bevy_egui = "0.42.0"
naga = { version = "0.19", features = ["wgsl-in"] }
rfd = "0.15"
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "bevy-hello-world"
path = "src/main.rs"

[[bin]]
name = "shader-tools"
path = "src/tools_bin.rs"
