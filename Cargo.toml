[package]
name = "bevy-hello-world"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.14", default-features = false, features = [
    "bevy_asset",
    "bevy_sprite",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_ui",
    "bevy_text",
    "png",
    "x11",
] }

[[bin]]
name = "bevy-hello-world"
path = "src/main.rs"

[[bin]]
name = "shader-tools"
path = "src/tools_bin.rs"
